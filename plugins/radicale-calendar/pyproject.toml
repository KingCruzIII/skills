[project]
name = "radicale-calendar-plugin"
version = "1.0.0"
description = "Hermes plugin for a self-hosted Radicale CalDAV calendar"
requires-python = ">=3.10"
dependencies = [
  "caldav>=3.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
